apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def versionProps = new Properties() // FORK:fork-identity
rootProject.file("version.properties").withInputStream { versionProps.load(it) } // FORK:fork-identity

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.olauncher"
        applicationIdSuffix ".abacate" // FORK:fork-identity
        minSdkVersion 24
        targetSdkVersion 36
        versionCode versionProps.getProperty("VERSION_CODE").toInteger() // FORK:fork-identity
        versionName versionProps.getProperty("VERSION_NAME") // FORK:fork-identity
        resValue "string", "fork_app_name", "Abacate Lançador" // FORK:fork-identity
        resValue "string", "fork_label_name", "Lançador" // FORK:fork-identity

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fa", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh", "zh-rTW"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets { // FORK:fork-identity
        debug.res.srcDirs += ['src/fork/res'] // FORK:fork-identity
        release.res.srcDirs += ['src/fork/res'] // FORK:fork-identity
    } // FORK:fork-identity

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
    lint { // FORK:fork-identity
        baseline = file("lint-baseline.xml") // FORK:fork-identity
    } // FORK:fork-identity
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material
    implementation libs.viewpager2 // FORK:widget-screen

    testImplementation libs.junit
}
